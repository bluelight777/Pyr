[package]
name = "pyr-props"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The props feed's maker: reads public sources (scoreboards, prices, the weather, earthquakes), makes prop bets from them and says how each came out, in one signed file Pyr servers follow."

[[bin]]
name = "pyr-props"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
pyr-proto = { path = "../proto" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
