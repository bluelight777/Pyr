[package]
name = "ingle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ingle desktop app."

[[bin]]
name = "ingle"
path = "src/main.rs"

[dependencies]
ingle-proto = { path = "../proto" }
ingle-engine = { path = "../engine" }
ingle-host = { path = "../host" }
directories = "6.0.0"
eframe = { version = "0.33.3", features = ["wgpu"] }
tracing = "0.1.44"
anyhow = "1.0.104"
parking_lot = "0.12.5"
chrono = "0.4.45"
serde_json = "1.0.152"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
# Images in chat and profile pictures.
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
# Pasting images.
arboard = { version = "3.6", default-features = false, features = ["image-data"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
# Ctrl+V with an image on the clipboard (egui only reports text pastes).
device_query = "4.0.1"
# Spellcheck in the message box: Hunspell dictionaries, checked in pure Rust (spell.rs).
spellbook = "0.4.2"
# Plugins: add-ons are WebAssembly, run in an interpreter with no imports, fuel and memory
# limits (plugins/addon.rs).
# (portable-dispatch: the plain loop, never tail calls that LLVM may not turn into jumps, which
# would let a long-running add-on overflow the stack and take Ingle down with it.)
wasmi = { version = "2.0.0", default-features = false, features = ["std", "validate", "stable", "portable-dispatch"] }
# Reading a plugin's Cargo.toml before sending it in.
toml = "1.1"

# Choosing and saving files (native dialogs; the desktop portal on Linux).
[target.'cfg(windows)'.dependencies.rfd]
version = "0.15"
default-features = false

[target.'cfg(not(windows))'.dependencies.rfd]
version = "0.15"
default-features = false
features = ["xdg-portal", "tokio"]

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    # The icon by the clock (tray.rs).
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    # Opening with Windows (autostart.rs).
    "Win32_System_Registry",
    # The taskbar button's unread dot (tray.rs).
    "Win32_System_Com",
    # The hang recorder (watchdog.rs).
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_ProcessStatus",
    "Win32_System_SystemInformation",
    # Programs open inside Ingle's window (plugins/programs.rs): following it as it moves,
    # square corners, and ending with Ingle if it doesn't get to close them (a job).
    "Win32_UI_Accessibility",
    "Win32_Graphics_Dwm",
    "Win32_System_JobObjects",
    "Win32_Security",
] }
# The window's HWND, for the tray icon to show and hide it.
raw-window-handle = "0.6.2"
# Copy picture: a picture and its file on the clipboard at once (the one arboard uses).
clipboard-win = { version = "5.4.1", features = ["std"] }

[build-dependencies]
embed-resource = "3.0.12"

[dev-dependencies]
# Hand-written WebAssembly for the add-on sandbox tests.
wat = "1"
# Animated PNGs for the moving-picture tests (the version the image crate uses).
png = "0.18"
