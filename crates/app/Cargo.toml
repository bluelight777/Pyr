[package]
name = "ingle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ingle desktop app."

[[bin]]
name = "ingle"
path = "src/main.rs"

[dependencies]
ingle-proto = { path = "../proto" }
ingle-engine = { path = "../engine" }
ingle-host = { path = "../host" }
directories = "6.0.0"
eframe = { version = "0.33.3", features = ["wgpu"] }
tracing = "0.1.44"
anyhow = "1.0.104"
parking_lot = "0.12.5"
chrono = "0.4.45"
serde_json = "1.0.152"
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
serde = { version = "1.0.229", features = ["derive"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
    # The icon by the clock (tray.rs).
    "Win32_UI_Shell",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
] }
# The window's HWND, for the tray icon to show and hide it.
raw-window-handle = "0.6.2"

[build-dependencies]
embed-resource = "3.0.12"
