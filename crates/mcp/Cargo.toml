[package]
name = "ingle-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Ingle's Claude connector: an MCP server that lets Claude make skins and plugins with you, show a skin on your Ingle as it goes, and send them to the Ingle Library for review."

[[bin]]
name = "ingle-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
ingle-engine = { path = "../engine" }
ingle-proto = { path = "../proto" }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
ingle-server = { path = "../server" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
