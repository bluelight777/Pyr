[package]
name = "pyr-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Pyr's Claude connector: an MCP server that lets Claude make skins and plugins with you, show a skin on your Pyr as it goes, send them to the Pyr Library for review, and chat in your servers as a bot."

[[bin]]
name = "pyr-mcp"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
pyr-engine = { path = "../engine" }
pyr-proto = { path = "../proto" }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "time"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
pyr-server = { path = "../server" }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "time"] }
