[package]
name = "pyr-directory"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The invite directory behind Pyr's short links (https://pyr.gg/<code>)."

[[bin]]
name = "pyr-directory"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
clap = { version = "4.6.7", features = ["derive"] }
http-body-util = "0.1.5"
hyper = { version = "1.12.0", features = ["server", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
parking_lot = "0.12.5"
pyr-proto = { path = "../proto" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-pki-types = "1.15.1"
rustls-webpki = { version = "0.103.15", default-features = false, features = ["std", "ring"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[dev-dependencies]
pyr-server = { path = "../server" }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
ureq = { version = "3.4.2", default-features = false, features = ["rustls", "json"] }
