[package]
name = "ingle-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Ingle client engine: networking, audio and video pipelines (no UI)."

[dependencies]
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = "0.4.45"
cpal = "0.18.2"
crossbeam-channel = "0.5.17"
device_query = "4.0.1"
directories = "6.0.0"
fast_image_resize = "6.1.0"
getrandom = "0.2"
ingle-proto = { path = "../proto", features = ["quic"] }
nnnoiseless = { version = "0.5.2", default-features = false }
openh264 = "0.9.8"
opus = "0.4.0"
parking_lot = "0.12.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rtrb = "0.4.0"
rubato = "5.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10"
sonora = "0.2.0"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
tracing = "0.1.44"
yuv = "0.8.19"

[dev-dependencies]
ingle-server = { path = "../server" }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    # The green frame around what you're sharing (video/border.rs).
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    # Voice priority (qos.rs).
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
] }
windows-capture = "2.0.1"
nokhwa = { version = "0.10.11", features = ["input-msmf"] }
wasapi = "0.25.0"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11rb = "0.13"
nokhwa = { version = "0.10.11", features = ["input-v4l"] }
