[package]
name = "pyr-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Pyr client engine: networking, audio and video pipelines (no UI)."

[dependencies]
# Checking a skin's fonts parse before the app's text renderer gets them (the same crate egui
# reads fonts with).
ab_glyph = "0.2.32"
anyhow = "1.0.104"
base64 = "0.22.1"
bytes = "1.12.1"
chrono = "0.4.45"
cpal = "0.18.2"
# Voice isolation: DeepFilterNet3 (MIT/Apache-2.0), with its model built in.
deep_filter = { git = "https://github.com/Rikorose/DeepFilterNet", rev = "d375b2d8309e0935d165700c91da9de862a99c31", default-features = false, features = ["tract", "default-model"] }
ndarray = "0.15"
# deep_filter is written for tract 0.21.4 (later 0.21 releases moved to a newer ndarray).
tract-core = "=0.21.4"
tract-onnx = "=0.21.4"
tract-hir = "=0.21.4"
tract-pulse = "=0.21.4"
crossbeam-channel = "0.5.17"
device_query = "4.0.1"
directories = "6.0.0"
fast_image_resize = "6.1.0"
getrandom = "0.2"
pyr-proto = { path = "../proto", features = ["quic"] }
pyr-poker = { path = "../poker" }
nnnoiseless = { version = "0.5.2", default-features = false }
openh264 = "0.9.8"
# OpenH264's own option types, for changing a running encoder's bitrate and frame rate.
openh264-sys2 = { version = "0.9.8", default-features = false }
opus = "0.4.0"
parking_lot = "0.12.5"
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-ring", "log"] }
rtrb = "0.4.0"
realfft = "3.5.0"
rubato = "5.0.1"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.10"
sonora = "0.2.0"
# Reading audio files for the soundboard (MP3, AAC/M4A, Ogg Vorbis, FLAC, WAV); MPL-2.0.
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "aac", "isomp4", "ogg", "vorbis", "flac", "wav", "pcm", "adpcm"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "io-util"] }
# Reading a plugin's Cargo.toml (what it says about itself) before it's sent in.
toml = "1.1"
tracing = "0.1.44"
yuv = "0.8.19"

[dev-dependencies]
pyr-server = { path = "../server" }
# The test bot's media log (examples/bot.rs --media-log).
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Threading",
    "Win32_Foundation",
    # The green frame around what you're sharing (video/border.rs).
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
    # Voice priority (qos.rs).
    "Win32_NetworkManagement_QoS",
    "Win32_Networking_WinSock",
    "Win32_System_IO",
    # Asking whether Windows took the screen capture's graphics device away (video/capture.rs).
    "Win32_Graphics_Direct3D11",
    # How long since the last key or mouse move, for idle (idle.rs).
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemInformation",
    # Sound devices opened from COM's multithreaded apartment (audio/device.rs).
    "Win32_System_Com",
] }
windows-capture = "2.0.1"
nokhwa = { version = "0.10.11", features = ["input-msmf"] }
wasapi = "0.25.0"

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { version = "0.10.11", features = ["input-avfoundation"] }

[target.'cfg(target_os = "linux")'.dependencies]
# (screensaver: how long since the last key or mouse move, for idle.)
x11rb = { version = "0.13", features = ["screensaver"] }
nokhwa = { version = "0.10.11", features = ["input-v4l"] }
