<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Bricolage"; src: url(assets/fonts/bricolage-grotesque.woff2) format("woff2"); font-weight: 200 800; }
@font-face { font-family: "Inter"; src: url(assets/fonts/inter.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "Instrument Serif"; src: url(assets/fonts/instrument-serif-italic.woff2) format("woff2"); font-style: italic; }
html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; background: #100c0a; }
body { position: relative; font-family: Inter, sans-serif; color: #dccfc4;
  background:
    radial-gradient(620px 420px at 78% 70%, rgba(255, 110, 45, .32), transparent 70%),
    radial-gradient(900px 380px at 30% 120%, rgba(255, 90, 40, .30), transparent 70%),
    radial-gradient(500px 300px at 0% 0%, rgba(255, 170, 90, .12), transparent 70%),
    #100c0a; }
.brand { position: absolute; left: 64px; top: 56px; display: flex; align-items: center; gap: 14px; font: 750 32px/1 Bricolage; color: #f6eee7; letter-spacing: -.02em; }
.brand img { width: 52px; height: 52px; border-radius: 13px; }
.brand span { font: 500 17px/1 Inter; color: #8f8175; letter-spacing: 0; margin-left: 4px; margin-top: 6px; }
h1 { position: absolute; left: 64px; top: 150px; width: 560px; margin: 0; font: 760 66px/1.02 Bricolage; letter-spacing: -.035em; color: #f6eee7; }
h1 em { font: italic 400 1.12em/1 "Instrument Serif"; letter-spacing: -.01em;
  background: linear-gradient(100deg, #ffd08a 0%, #ffb347 30%, #ff7a3d 62%, #ff5b3a 100%); -webkit-background-clip: text; background-clip: text; color: transparent; }
.sub { position: absolute; left: 64px; bottom: 64px; display: flex; gap: 10px; flex-wrap: wrap; width: 600px; }
.sub span { padding: 9px 15px; border-radius: 999px; font: 600 17px/1 Inter; color: #f0e2d6; background: rgba(255, 236, 220, .07); border: 1px solid rgba(255, 214, 180, .16); }
.sub span.hot { color: #1d120b; background: linear-gradient(180deg, #ffc27a, #ff7a3d); border: 0; }
.shot { position: absolute; right: -70px; top: 92px; width: 640px; perspective: 1400px; }
.win { border-radius: 14px; overflow: hidden; border: 1px solid rgba(255, 214, 180, .16); transform: rotateY(-14deg) rotateX(6deg);
       box-shadow: 0 40px 100px -30px rgba(0, 0, 0, .9), 0 30px 80px -30px rgba(255, 100, 40, .45); background: #1b1512; }
.win img { display: block; width: 100%; }
</style></head>
<body>
  <div class="brand"><img src="pyr-icon.png" alt="">Pyr<span>by Firelit Games</span></div>
  <h1>Hang out with your friends on a server <em>you own.</em></h1>
  <div class="sub"><span class="hot">Free</span><span>Voice channels</span><span>1080p60 streams</span><span>No account</span></div>
  <div class="shot"><div class="win"><img src="assets/img/chat.webp" alt=""></div></div>
</body></html>
