[package]
name = "pyr-hello"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A starting point for a Pyr add-on."

[lib]
# cdylib: the .wasm Pyr runs; rlib: so `cargo test` works on your PC.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The kit (Pyr's "Start an add-on" puts a copy of it in a pyr-plugin folder next to this).
pyr-plugin = { path = "../kit" }

# What the Pyr Library shows about it (and the form to send it in fills itself in from here).
[package.metadata.pyr]
kind = "addon"
name = "Hello"
summary = "Says hello in chat, and counts clicks in its panel."
# What it does: "commands" (adds /commands), "panel" (shows a panel), "storage" (keeps data).
permissions = ["commands", "panel", "storage"]
