[package]
name = "ingle-hello"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "A starting point for an Ingle add-on."

[lib]
# cdylib: the .wasm Ingle runs; rlib: so `cargo test` works on your PC.
crate-type = ["cdylib", "rlib"]

[dependencies]
# The kit (Ingle's "Start an add-on" puts a copy of it in an ingle-plugin folder next to this).
ingle-plugin = { path = "../kit" }

# What the Ingle Library shows about it (and the form to send it in fills itself in from here).
[package.metadata.ingle]
kind = "addon"
name = "Hello"
summary = "Says hello in chat, and counts clicks in its panel."
# What it does: "commands" (adds /commands), "panel" (shows a panel), "storage" (keeps data).
permissions = ["commands", "panel", "storage"]
